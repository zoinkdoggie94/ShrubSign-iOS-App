name: ShrubSign Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrubsign-release
  cancel-in-progress: false

jobs:
  build:
    name: Build & Release
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache Swift package checkouts and build dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ShrubSign/SourcePackages
          key: shrubsign-macos26-deps-v1-${{ hashFiles('ShrubSign.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            shrubsign-macos26-deps-v1-

      # Compilation reuse is best-effort. GitHub may evict or decline to cache
      # large build folders, so clean builds remain supported.
      - name: Restore compiled Xcode dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ShrubSign/Build
          key: shrubsign-compiled-macos26-v2-${{ hashFiles('ShrubSign.xcodeproj/project.pbxproj', 'makefile') }}-${{ github.sha }}
          restore-keys: |
            shrubsign-compiled-macos26-v2-${{ hashFiles('ShrubSign.xcodeproj/project.pbxproj', 'makefile') }}-

      - name: Build
        run: |
          # Save a complete searchable log and print actionable compiler diagnostics
          # even when xcodebuild's final lines contain only Error 65.
          set +e
          make > "$RUNNER_TEMP/shrubsign-build.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            LOG="$RUNNER_TEMP/shrubsign-build.log"
            echo "Build command failed with exit code $result"
            echo "Build log size: $(wc -c < "$LOG") bytes"
            echo "::group::Compiler errors and failure messages"
            grep -a -nEi -C 3 '(^|[[:space:]])error:|fatal error:|build failed|make: \*\*\*|failed|cannot find|invalid redeclaration|ambiguous use|no such module' "$LOG" | tail -n 180 || true
            echo "::endgroup::"
            echo "::group::Start of the nonempty build log"
            tr '\r' '\n' < "$LOG" | sed '/^[[:space:]]*$/d' | head -n 40 || true
            echo "::endgroup::"
            echo "::group::Final 120 nonempty build-log lines"
            tr '\r' '\n' < "$LOG" | sed '/^[[:space:]]*$/d' | tail -n 120 || true
            echo "::endgroup::"
            exit "$result"
          fi
          tail -n 25 "$RUNNER_TEMP/shrubsign-build.log"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shrubsign-build-errors
          path: ${{ runner.temp }}/shrubsign-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate IPA
        run: |
          set -euo pipefail
          test -s packages/ShrubSign.ipa
          unzip -tq packages/ShrubSign.ipa
          zipinfo -1 packages/ShrubSign.ipa | grep -Fxq 'Payload/ShrubSign.app/Info.plist'
          zipinfo -1 packages/ShrubSign.ipa | grep -Fxq 'Payload/ShrubSign.app/ShrubSign'
          echo "ShrubSign IPA passed archive and bundle validation."

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 'MARKETING_VERSION = ' ShrubSign.xcodeproj/project.pbxproj | sed -E 's/.*= ([^;]+);/\1/')
          TAG="v${VERSION}-build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          COMMIT_MSG=$(git log -1 --pretty=%B)

          echo "## ShrubSign ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "Commit: \`${COMMIT_MSG}\` (${{ github.sha }})" >> release_notes.md
          echo "" >> release_notes.md
          echo "This release keeps older ShrubSign releases and IPA assets available." >> release_notes.md
          echo "" >> release_notes.md
          echo "### Recent changes" >> release_notes.md
          git log -n 20 --pretty=format:'* %s (%h)' >> release_notes.md
          echo "" >> release_notes.md

          gh release create "$TAG" "packages/ShrubSign.ipa" \
            --title "ShrubSign ${VERSION} · Build ${GITHUB_RUN_NUMBER}" \
            --notes-file release_notes.md \
            --target "${{ github.sha }}" \
            --latest

          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Update AltStore repo.json after release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          python3 scripts/update_repo.py

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured; notification skipped."
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          REPO="${{ github.repository }}"
          TAG="${RELEASE_TAG:-latest}"
          FILENAME="ShrubSign.ipa"
          
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          echo "Sending link to Discord..."
          
          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            '{content: "**New ShrubSign Release!**\n\nChanges: `\($commit_msg)`\n\n[**Download IPA**](\($download_url))\n[View Release](\($release_url))"}' > discord_payload.json

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK"
