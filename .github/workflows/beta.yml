name: Beta Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shrubsign-beta-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Beta
    runs-on: macos-26

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: |
          # Save a complete searchable log and print actionable compiler diagnostics
          # even when xcodebuild's final lines contain only Error 65.
          set +e
          make > "$RUNNER_TEMP/shrubsign-build.log" 2>&1
          result=$?
          set -e
          if [ "$result" -ne 0 ]; then
            echo "::group::Compiler and build errors"
            grep -nEi -C 3 '(^|/)[^ ]+\.swift:[0-9]+:[0-9]+: error:|error:|fatal error:|BUILD FAILED|\*\* BUILD FAILED \*\*' \
              "$RUNNER_TEMP/shrubsign-build.log" | tail -n 180 || true
            echo "::endgroup::"
            echo "::group::Final build output"
            tail -n 70 "$RUNNER_TEMP/shrubsign-build.log"
            echo "::endgroup::"
            exit "$result"
          fi
          tail -n 25 "$RUNNER_TEMP/shrubsign-build.log"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shrubsign-build-errors
          path: ${{ runner.temp }}/shrubsign-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Update Beta Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_OFFICIAL_TAG=$(git describe --tags --match "v*" --abbrev=0 2>/dev/null || echo "")
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "## Commit: \`$COMMIT_MSG\` (${{ github.sha }})" >> release_notes.md
          echo "### New in this build (Compared to $LATEST_OFFICIAL_TAG):" >> release_notes.md
            
          if [ -n "$LATEST_OFFICIAL_TAG" ]; then
            CHANGES=$(git log --pretty=format:"* %s (%h)" "${LATEST_OFFICIAL_TAG}..HEAD")
          else
            CHANGES=$(git log -n 20 --pretty=format:"* %s (%h)")
          fi
            
          if [ -z "$CHANGES" ]; then
            echo "* No code changes since $LATEST_OFFICIAL_TAG" >> release_notes.md
          else
            echo "$CHANGES" >> release_notes.md
          fi
          
          echo "### Commit SHA: ${{ github.sha }}" >> release_notes.md
          
          cat release_notes.md

          if gh release view beta >/dev/null 2>&1; then
            gh release delete beta --cleanup-tag -y
          fi
          
          gh release create beta "packages/ShrubSign.ipa" \
            --title "ShrubSign Beta" \
            --notes "$(cat release_notes.md)" \
            --prerelease \
            --target ${{ github.sha }}

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord webhook not configured; notification skipped."
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%B)
          
          REPO="${{ github.repository }}"
          TAG="beta"
          FILENAME="ShrubSign.ipa"
          
          DOWNLOAD_URL="https://github.com/$REPO/releases/download/$TAG/$FILENAME"
          RELEASE_URL="https://github.com/$REPO/releases/tag/$TAG"
          
          echo "Sending link to Discord..."
          
          jq -n \
            --arg commit_msg "$COMMIT_MSG" \
            --arg download_url "$DOWNLOAD_URL" \
            --arg release_url "$RELEASE_URL" \
            '{content: "**New ShrubSign Beta Released!**\n\nChanges: `\($commit_msg)`\n\n[**Download IPA**](\($download_url))\n[View Release](\($release_url))"}' > discord_payload.json

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d @discord_payload.json \
            "$DISCORD_WEBHOOK"
